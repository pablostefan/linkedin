telegram_library_comparison:
  recommendation: "grammY"
  justification: >
    grammY é TypeScript-first (tipos nativos sem @types/*), tem conversations plugin
    nativo para fluxos stateful (exatamente o que o bot precisa para refinamento de post com IA),
    InlineKeyboard com fluent API, InputFile para uploads, e ecossistema de plugins.
    Telegraf é madura mas menos TypeScript-friendly. node-telegram-bot-api é muito low-level
    para o nível de state management requerido.

  grammy:
    npm_package: "grammy"
    typescript: "Nativo — tipado desde o design, sem @types necessário"
    long_polling: "bot.start() — inicia long-polling automaticamente"
    inline_keyboard: >
      new InlineKeyboard().text("Sim", "confirm_yes").text("Não", "confirm_no")
      — fluent API com .row() para quebra de linha
    callback_query: 'bot.callbackQuery("confirm_yes", async (ctx) => { ... })'
    photo_upload: 'new InputFile("/path/to/photo.jpg") ou new InputFile(buffer)'
    file_download: "await ctx.getFile() → file.download() ou construir URL com file_path"
    session: '@grammyjs/session — bot.use(session({ initial: () => ({}) }))'
    conversations: >
      @grammyjs/conversations — plugin nativo para fluxos multi-step:
      async function createPost(conversation, ctx) {
        await ctx.reply("Qual o tema?");
        const topic = await conversation.waitFor("message:text");
        // ... refinar com IA ...
        await ctx.reply("Confirma?", { reply_markup: keyboard });
        const confirm = await conversation.waitForCallbackQuery(["yes","no"]);
      }
    graceful_shutdown: "bot.stop() — para long-polling gracefully"
    error_handling: "bot.catch((err) => { ... })"
    middleware: "Estilo express: bot.use(middleware)"
    ecosystem: "Plugins: conversations, session, menu, router, i18n, hydrate, auto-retry"
    maintenance: "Muito ativo — releases frequentes, docs atualizados"
    external_state_access: >
      Dentro de conversations, usar conversation.external(() => someAsyncCall())
      para chamar APIs externas (GitHub Models, local-state) de forma safe.

  telegraf:
    npm_package: "telegraf"
    typescript: "Suporte via @types/telegraf ou tipos embutidos (v4+), mas não TypeScript-first"
    long_polling: "bot.launch() — inicia long-polling; process.once('SIGINT', () => bot.stop('SIGINT'))"
    inline_keyboard: "Markup.inlineKeyboard([Markup.button.callback('Sim', 'confirm')])"
    callback_query: "bot.action('confirm', async (ctx) => { ... })"
    photo_upload: "ctx.replyWithPhoto(Input.fromLocalFile('/path/photo.jpg'))"
    file_download: "bot.on(message('photo'), ctx => { ctx.telegram.getFileLink(fileId) })"
    session: "Embutido: bot.use(session())"
    conversations: "Sem plugin nativo — requer implementação manual de state machine"
    graceful_shutdown: "Graceful via SIGINT/SIGTERM handlers fornecidos"
    error_handling: "bot.catch((err, ctx) => { ... })"
    middleware: "Estilo express: bot.use(middleware)"
    ecosystem: "Maduro — session, stage, scenes (Wizard), rate-limit"
    maintenance: "Ativo mas menos frequente que grammY"
    notes: >
      Telegraf Scenes/Wizard pode replicar conversations mas com more boilerplate.
      Scenes usam enter/leave/on pattern, menos ergonômico que grammY conversations.

  node_telegram_bot_api:
    npm_package: "node-telegram-bot-api"
    typescript: "Requer @types/node-telegram-bot-api — tipos comunitários"
    long_polling: "new TelegramBot(token, { polling: true })"
    inline_keyboard: >
      Keyboard JSON manual: { reply_markup: { inline_keyboard: [[{ text: 'Sim', callback_data: 'yes' }]] } }
    callback_query: "bot.on('callback_query', (query) => { ... })"
    photo_upload: "bot.sendPhoto(chatId, '/path/photo.jpg')"
    file_download: "bot.downloadFile(fileId, './downloads/')"
    session: "Sem suporte nativo — implementação totalmente manual"
    conversations: "Sem suporte — state management totalmente manual"
    graceful_shutdown: "bot.stopPolling() — manual"
    error_handling: "bot.on('polling_error', (error) => { ... })"
    middleware: "Sem sistema de middleware — event listeners puros"
    ecosystem: "Minimalista — poucas extensões"
    maintenance: "Manutenção esporádica"
    notes: >
      Adequado para bots simples. Para o nível de state management e
      conversação IA requerido pelo PRD, exigiria muito código custom.

# =============================================================================
# DOMÍNIO 2: GITHUB MODELS API
# =============================================================================

github_models_api:
  endpoint: "https://models.github.ai/inference/chat/completions"
  method: POST
  format: "OpenAI-compatible chat completions"

  authentication:
    type: "Personal Access Token (PAT)"
    scope: "models"
    header: "Authorization: Bearer <GITHUB_PAT>"

  headers:
    - "Accept: application/vnd.github+json"
    - "Authorization: Bearer <GITHUB_PAT>"
    - "X-GitHub-Api-Version: 2022-11-28"
    - "Content-Type: application/json"

  request_format: |
    {
      "model": "openai/gpt-4.1",
      "messages": [
        { "role": "system", "content": "..." },
        { "role": "user", "content": "..." }
      ]
    }

  response_format: |
    {
      "choices": [
        {
          "message": {
            "role": "assistant",
            "content": "..."
          }
        }
      ]
    }

  recommended_models:
    primary: "openai/gpt-4.1"
    rationale: >
      Modelo high-tier com boa qualidade de texto. Alternativas: openai/gpt-4o (mais rápido),
      openai/gpt-4.1-mini (menor, mais RPM se rate limit for problema).

  rate_limits_copilot_pro:
    low_tier_models:
      requests_per_minute: 15
      requests_per_day: 150
      tokens_per_request_input: 8000
      tokens_per_request_output: 4000
      models: "gpt-4o-mini, gpt-4.1-nano, etc."
    high_tier_models:
      requests_per_minute: 10
      requests_per_day: 50
      tokens_per_request_input: 8000
      tokens_per_request_output: 4000
      models: "gpt-4o, gpt-4.1, gpt-4.1-mini, etc."
    reasoning_models:
      requests_per_minute: 2
      requests_per_day: 12
      models: "o1, o3-mini, o4-mini"

  integration_notes: >
    Para bot single-user, 50 RPD (high-tier) é suficiente para ~50 refinamentos/dia.
    Usar openai/gpt-4.1 como padrão. Implementar retry com backoff para 429.
    Mensagem de sistema deve instruir IA sobre estilo de post LinkedIn do usuário
    (sem emojis, sem travessão longo, português, tom profissional).

  code_example: |
    async function chatWithModel(messages: ChatMessage[]): Promise<string> {
      const response = await fetch("https://models.github.ai/inference/chat/completions", {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${process.env.GITHUB_TOKEN}`,
          "X-GitHub-Api-Version": "2022-11-28",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "openai/gpt-4.1",
          messages
        })
      });

      if (!response.ok) {
        throw new Error(`GitHub Models API error: ${response.status}`);
      }

      const data = await response.json();
      return data.choices[0].message.content;
    }

# =============================================================================
# DOMÍNIO 3: CONVERSATION STATE MANAGEMENT
# =============================================================================

conversation_state_management:
  approach: "grammY conversations plugin (@grammyjs/conversations)"
  rationale: >
    O plugin permite escrever fluxos multi-step como funções assíncronas lineares,
    eliminando state machines manuais. Cada conversa tem estado tipado.
    Ideal para o fluxo: ideia → refinamento com IA → preview → confirmação → publicação.

  session_type_definition: |
    interface SessionData {
      conversationState: {
        messages: Array<{ role: "user" | "assistant" | "system"; content: string }>;
        currentDraftId: string | null;
        pendingConfirmationId: string | null;
      };
    }

  conversation_flow_pattern: |
    async function refineDraft(conversation, ctx) {
      // 1. Coletar ideia inicial
      await ctx.reply("Qual o tema do post?");
      const { message } = await conversation.waitFor("message:text");

      // 2. Chamar GitHub Models para primeiro rascunho
      const refined = await conversation.external(() =>
        chatWithModel([
          { role: "system", content: SYSTEM_PROMPT },
          { role: "user", content: message.text }
        ])
      );
      await ctx.reply(refined);

      // 3. Loop de refinamento
      while (true) {
        await ctx.reply("Deseja ajustar algo ou salvar como rascunho?", {
          reply_markup: new InlineKeyboard()
            .text("Salvar rascunho", "save_draft")
            .text("Continuar refinando", "refine_more")
        });

        const callback = await conversation.waitForCallbackQuery(["save_draft", "refine_more"]);

        if (callback.match === "save_draft") break;

        await ctx.reply("O que deseja mudar?");
        const adjustment = await conversation.waitFor("message:text");
        // ... chamar IA novamente com histórico ...
      }

      // 4. Salvar draft
      const draft = await conversation.external(() =>
        localState.saveDraft({ content: refined })
      );
      await ctx.reply(`Rascunho salvo: ${draft.draftId}`);
    }

  external_calls_pattern: >
    conversation.external(() => asyncCall()) é obrigatório para chamar
    APIs externas (GitHub Models, local-state, zernio) dentro de conversations.
    Garante replay safety do plugin.

  session_persistence: >
    Para bot single-user local, session in-memory é suficiente.
    Para Railway (processo persistent), session in-memory funciona entre restarts
    (volume para dados, mas session de conversa pode ser ephemeral — conversas
    longas devem ter checkpoint via draft salvo).

# =============================================================================
# DOMÍNIO 4: FILE HANDLING (PHOTO UPLOAD)
# =============================================================================

file_handling:
  telegram_photo_flow: |
    1. User envia foto no Telegram
    2. Bot recebe update com message.photo (array de PhotoSize)
    3. Bot pega file_id do maior tamanho: msg.photo[msg.photo.length - 1].file_id
    4. Bot chama getFile(file_id) → retorna file_path
    5. Bot baixa arquivo via URL: https://api.telegram.org/file/bot<token>/<file_path>
    6. Bot salva em .local/linkedin/uploads/<uuid>.<ext>
    7. Bot usa path local como --image-path no draft

  grammy_implementation: |
    bot.on("message:photo", async (ctx) => {
      const photo = ctx.message.photo;
      const largest = photo[photo.length - 1]; // maior resolução
      const file = await ctx.api.getFile(largest.file_id);

      // Download
      const url = `https://api.telegram.org/file/bot${token}/${file.file_path}`;
      const response = await fetch(url);
      const buffer = Buffer.from(await response.arrayBuffer());

      // Salvar
      const ext = path.extname(file.file_path || ".jpg");
      const localPath = path.join(uploadsDir, `${crypto.randomUUID()}${ext}`);
      await fs.writeFile(localPath, buffer);

      // Criar draft com imagem
      const draft = await localState.saveDraft({
        content: ctx.message.caption || "Post com imagem",
        postOptions: { image: { path: localPath, altText: "" } }
      });
    });

  link_preview_detection: >
    Bot detecta URLs em mensagens de texto via regex.
    Se URL detectada, extrai e usa como article source.
    User pode adicionar título/descrição via conversa ou IA pode sugerir.

  file_size_limits:
    telegram_photo_max: "20 MB (via Bot API regular)"
    telegram_download: "Automático via getFile + fetch"
    linkedin_image_max: "Depende do Zernio — tipicamente 10 MB"

# =============================================================================
# DOMÍNIO 5: HOSTING COMPARISON
# =============================================================================

hosting_comparison:
  recommendation: "Railway"
  justification: >
    Railway oferece billing por segundo com custo mínimo (~$1.94/mês para shared-cpu-1x 256MB
    always-on), persistent volumes a $0.15/GB/mês para dados do bot (.local/ com drafts.json,
    history, uploads), deploy automático via Git push, e variáveis de ambiente nativas.
    Para bot single-user com long-polling que roda 24/7, Railway é a opção mais econômica
    e simples. Hobby plan ($5/mês com $5 créditos) cobre o bot com folga.

  railway:
    pricing_model: "Usage-based, prorated por segundo"
    plans:
      free_trial: "$0/mês — 30 dias trial com $5 créditos, up to 1 vCPU/0.5GB RAM"
      hobby: "$5/mês (inclui $5 créditos) — up to 48 vCPU/48GB RAM, single developer"
      pro: "$20/mês (inclui $20 créditos) — up to 1TB storage, unlimited seats"
    compute_costs:
      cpu: "$0.00000772/vCPU/sec (~$20/mês para 1 vCPU full)"
      memory: "$0.00000386/GB/sec (~$10/mês para 1GB full)"
      smallest_always_on: "shared-cpu-1x 256MB ≈ $1.94/mês"
    volumes: "$0.15/GB/mês — persistent storage para .local/ data"
    estimated_monthly_cost: "$1.94 compute + $0.15 volume (1GB) = ~$2.09/mês (dentro do $5 credit do Hobby)"
    deploy: "Git push → auto build → deploy"
    env_vars: "Nativo — settings panel"
    custom_domain: "2 domínios customizados no Hobby (não necessário para bot long-polling)"
    cron_jobs: "Suportado"

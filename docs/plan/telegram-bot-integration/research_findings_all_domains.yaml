related_conventions:
  naming_patterns_in_domain: "camelCase para funções/variáveis, PascalCase para classes/tipos TypeScript, UPPER_SNAKE para env vars"
  structure_of_domain: >
    Bot TypeScript em novo diretório (e.g. src/bot/) importando módulos existentes de src/.
    Entry point separado do CLI (e.g. src/bot/index.ts).
  error_handling_in_domain: "Error codes customizados (.code property) propagados como mensagens Telegram amigáveis"
  testing_in_domain: "Node.js built-in test runner (node --test), sem framework externo. Testes em test/*.test.js"
  documentation_in_domain: "PRD.yaml para requisitos, AGENTS.md para convenções, docs/ para documentação técnica"

related_dependencies:
  internal:
    - component: local-state.js
      relationship_to_domain: "Bot importa createLocalState para CRUD de drafts e publish intents"
      direction: outbound
    - component: zernio.js
      relationship_to_domain: "Bot importa publishPost e resolveApiKey para publicação LinkedIn"
      direction: outbound
    - component: config.js
      relationship_to_domain: "Bot importa appConfig para paths de arquivos locais"
      direction: outbound
  external:
    - name: grammy
      purpose_for_domain: "Core framework para bot Telegram com long-polling"
    - name: "@grammyjs/conversations"
      purpose_for_domain: "Plugin para conversação multi-step stateful"
    - name: "@grammyjs/session"
      purpose_for_domain: "Middleware para persistir estado entre mensagens"
    - name: "typescript"
      purpose_for_domain: "Compilador TypeScript (dev dependency)"

domain_security_considerations:
  sensitive_areas:
    - area: "Telegram Bot Token"
      location: "Variável de ambiente TELEGRAM_BOT_TOKEN"
      concern: "Token dá acesso total ao bot — deve ser secret no hosting"
    - area: "GitHub PAT"
      location: "Variável de ambiente GITHUB_TOKEN"
      concern: "PAT com scope models — acesso à API de IA"
    - area: "Zernio API Key"
      location: "~/.zernio/config.json ou env var ZERNIO_API_KEY"
      concern: "Acesso à API de publicação LinkedIn"
    - area: "Owner Chat ID"
      location: "Variável de ambiente TELEGRAM_OWNER_CHAT_ID"
      concern: "Identifica o dono — mensagens de outros chat_ids devem ser ignoradas silenciosamente"
  authentication_patterns_in_domain: >
    Middleware de autenticação como primeiro handler:
    bot.use(async (ctx, next) => {
      if (String(ctx.chat?.id) !== process.env.TELEGRAM_OWNER_CHAT_ID) return;
      await next();
    });
  authorization_patterns_in_domain: "Single-user — qualquer mensagem do dono é autorizada"
  data_validation_in_domain: >
    local-state.js já valida conteúdo (non-empty, postOptions normalized).
    Bot deve sanitizar input do Telegram antes de passar para módulos existentes.

testing_patterns:
  framework: "Node.js built-in test runner (node:test)"
  coverage_areas:
    - "cli.test.js — testes do CLI entry point"
    - "config.test.js — testes de configuração"
    - "local-state.test.js — testes de CRUD de drafts e publish intents"
    - "zernio.test.js — testes de integração com Zernio CLI"
  test_organization: "Arquivos test/*.test.js correspondendo a src/*.js"
  mock_patterns:
    - "Mocking de fs para testes de local-state (readFile, writeFile)"
    - "Mocking de childProcess.execFile para testes de zernio"

open_questions:
  - question: "Qual modelo exato do GitHub Models usar como padrão (gpt-4.1 vs gpt-4o)?"
    context: "gpt-4.1 tem melhor qualidade mas 50 RPD; gpt-4o é mais rápido mas mesmo limite. Para bot single-user, ambos cobrem."
    type: nice_to_know
    affects: ["conversacao-ia"]

  - question: "Manter conversação IA inteira em memória ou persistir mensagens em arquivo?"
    context: >
      grammY conversations plugin mantém estado em memória.
      Se o processo reiniciar, a conversa em andamento se perde.
      Para single-user, isso é aceitável se drafts são salvos frequentemente.
    type: nice_to_know
    affects: ["state-management"]

gaps:
  - area: "Telegram Bot API file download via grammY"
    description: >
      A documentação do grammY não detalha explicitamente o helper de download de arquivos.
      O padrão geral (getFile → construir URL → fetch) é documentado na API do Telegram e funciona,
      mas pode existir um helper nativo no grammY que simplifica.
    impact: nice_to_know
    affects: ["rich-posts"]

  - area: "Railway volume mount path para .local/"
    description: >
      Precisa confirmar o formato exato de configuração de volume mount no Railway
      para mapear o volume persistente ao diretório .local/linkedin/ usado pelos módulos.
    impact: nice_to_know
    affects: ["hosting"]

patterns_found:
  - category: architecture
    pattern: "Factory function com closure para state management"
    description: >
      local-state.js usa createLocalState(appConfig) que retorna objeto com métodos
      (listDrafts, getDraft, saveDraft, etc.) operando sobre appConfig via closure.
      Padrão funcional sem classes, compatível com import direto pelo bot.
    examples:
      - file: src/local-state.js
        location: "src/local-state.js:174"
        snippet: "export function createLocalState(appConfig) { ... return { listDrafts, getDraft, saveDraft, deleteDraft, ... } }"
    prevalence: common

  - category: architecture
    pattern: "JSON file como store com atomic writes"
    description: >
      Drafts são persistidos em JSON file com escrita atômica (write temp → rename).
      Backup automático após cada escrita. Bot precisa usar mesmo path via appConfig.
    examples:
      - file: src/local-state.js
        location: "src/local-state.js:214"
        snippet: "const tempFilePath = `${filePath}.${crypto.randomUUID()}.tmp`; await fs.writeFile(tempFilePath, ...); await fs.rename(tempFilePath, filePath);"
    prevalence: common

  - category: architecture
    pattern: "Intent-based publish flow com TTL"
    description: >
      Publicação usa two-phase commit: createPublishIntent gera confirmationId com expiresAt (5 min),
      confirmPublish valida e executa. Bot Telegram precisa replicar esse fluxo.
    examples:
      - file: src/local-state.js
        location: "src/local-state.js:340"
        snippet: "async function createPublishIntent({ draftId, content, postOptions, ... }) { ... expiresAt: new Date(now + 5 * 60 * 1000).toISOString() }"
    prevalence: common

  - category: error_handling
    pattern: "Error codes com propriedade .code customizada"
    description: >
      Erros têm .code string (e.g. "invalid_draft_content", "zernio_cli_error")
      para identificação programática. Bot deve capturar e traduzir para mensagens Telegram.
    examples:
      - file: src/local-state.js
        location: "src/local-state.js:260"
        snippet: 'error.code = "invalid_draft_content"'
      - file: src/zernio.js
        location: "src/zernio.js:12"
        snippet: 'wrapped.code = "zernio_cli_error"'
    prevalence: common

  - category: naming
    pattern: "camelCase para funções e variáveis, PascalCase para classes de erro"
    description: "Convenção consistente em todo o codebase"
    examples:
      - file: src/local-state.js
        location: "src/local-state.js:6"
        snippet: "export class DraftStoreCorruptedError extends Error"
    prevalence: common

  - category: structure
    pattern: "ESM com named exports"
    description: >
      Todos os módulos usam export function / export class (named exports).
      Sem default exports. Bot TypeScript importará via: import { createLocalState } from './local-state.js'
    examples:
      - file: src/local-state.js
        location: "src/local-state.js:174"
        snippet: "export function createLocalState(appConfig)"
      - file: src/zernio.js
        location: "src/zernio.js:95"
        snippet: "export async function publishPost({ content, accountId, options = {} })"
    prevalence: common


plan_id: telegram-bot-integration
objective: >
  Pesquisa completa para construir bot Telegram Node.js/TypeScript integrado com
  GitHub Models API para workflow de publicação LinkedIn. Abrange 5 áreas:
  (1) comparação de libs Telegram, (2) GitHub Models API, (3) state management
  para conversação, (4) file handling, (5) hosting. Resultado inclui UMA lib
  recomendada e UMA opção de hospedagem com justificativa.
focus_area: all_domains
created_at: "2025-07-14"
created_by: gem-researcher
status: completed

tldr: |
  - grammY é a lib recomendada: TypeScript-first, conversations plugin nativo para state management,
    InlineKeyboard fluent API, InputFile para uploads, ecossistema de plugins maduro.
  - GitHub Models API é OpenAI-compatible (POST https://models.github.ai/inference/chat/completions),
    autenticação via PAT com scope models, rate limits de 15 RPM / 150 RPD para modelos low-tier.
  - Railway é a hospedagem recomendada: billing por segundo (~$1.94/mês para shared-cpu-1x 256MB),
    persistent volumes $0.15/GB/mês, deploy via Git, ideal para bot single-user com long-polling.
  - Módulos existentes (local-state.js, zernio.js) exportam funções puras importáveis diretamente
    pelo bot TypeScript via ESM, sem necessidade de CLI spawn (conforme ADR-002).
  - Conversação stateful usa grammY conversations plugin com estado tipado em TypeScript,
    permitindo fluxo linear (onEnter → coleta → refinamento → confirmação) sem state machine manual.

research_metadata:
  methodology: >
    Hybrid retrieval: semantic_search no codebase + read_file para módulos existentes;
    Context7 resolve-library-id + query-docs para grammY, Telegraf, node-telegram-bot-api;
    fetch_webpage para GitHub Models API (quickstart + prototyping docs), Railway, Render, Fly.io pricing.
  scope: >
    5 domínios: (1) Telegram bot libraries, (2) GitHub Models API, (3) conversation state management,
    (4) file handling (photo upload/download), (5) hosting comparison.
    Escopo restrito ao in_scope do PRD. Análise de 6 arquivos do projeto existente +
    3 documentações de libs + 4 páginas de pricing + 2 páginas de API docs.
  confidence: high
  coverage: 95
  decision_blockers: 0
  research_blockers: 0

